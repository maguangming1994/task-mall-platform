        '200': { description: Reconciliation detail, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /admin/reconciliation-entries/{entry_id}/resolve:
    post:
      tags: [Admin, Payments]
      operationId: resolveReconciliationEntry
      security: [{ adminBearerAuth: [] }]
      parameters:
        - { name: entry_id, in: path, required: true, schema: { $ref: '#/components/schemas/PublicId' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [confirmed_channel_truth, confirmed_local_truth, ignored_with_reason] }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Resolution appended without overwriting payment facts, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    publisherBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户端任务发布中心专用的短时限权管理员会话，不能与普通用户 Token 互换。
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理后台独立会话，audience 固定为 task-mall-admin，不能与普通用户 Token 互换。
  parameters:
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: true
      schema:
        type: string
        enum: [wechat-mini, h5-wechat, h5-browser, admin-web]
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 191 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicId' }
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicId' }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicId' }
  requestBodies:
    CheckoutRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [items, group_options, capability_version]
            properties:
              capability_version: { type: integer, minimum: 1 }
              items:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/CheckoutItemInput' }
              group_options:
                type: array
                minItems: 1
                maxItems: 3
                description: 按交付类型配置地址、优惠券和唯一现金资金来源；每种交付类型最多一项。
                items: { $ref: '#/components/schemas/CheckoutGroupOptionInput' }
              preview_token:
                type: string
                description: 创建订单时提交预结算返回的短期令牌。
  responses:
    AuthSuccess:
      description: Authentication succeeded
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthTokens' }
    AdminAuthSuccess:
      description: Administrator authentication succeeded
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminAuthTokens' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated principal is not allowed to perform this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Business state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Upstream service is unavailable or not configured
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    PublicId:
      type: string
      minLength: 26
      maxLength: 26
      example: 01J4D5N6A7B8C9D0E1F2G3H4J5
    SuccessEnvelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code: { type: string, const: OK }
        message: { type: string, example: success }
        data: {}
        request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string, example: ORDER_STOCK_INSUFFICIENT }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        request_id: { type: string }
    Pagination:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    ClientCapabilities:
      type: object
      required: [version, platform, visitor_browsing, login_methods, share_methods, cash_payment_methods, wechat_payment_enabled, wallet_payment_enabled, external_task_publishing_enabled, external_task_publishing_stage, notification_channels, feature_flags]
      properties:
        version: { type: integer, minimum: 1 }
        platform: { type: string, enum: [wechat-mini, h5-wechat, h5-browser] }
        visitor_browsing: { type: boolean }
        login_methods:
          type: array
          items: { type: string, enum: [wechat_mini, wechat_oa, phone] }
        share_methods:
          type: array
          items: { type: string, enum: [mini_card, qr_code, wechat_js, web_share, copy_link] }
        cash_payment_methods:
          type: array
          items: { type: string, enum: [wallet, wechat_mini, wechat_jsapi, wechat_h5] }
        wechat_payment_enabled: { type: boolean }
        wallet_payment_enabled: { type: boolean }
        external_task_publishing_enabled: { type: boolean, description: 首发必须为 false；非平台发布里程碑通过联合评审后才可为 true。 }
        external_task_publishing_stage: { type: string, enum: [closed, invited_organizations, verified_users, open_applications] }
        h5_payment_status: { type: string, enum: [not_applicable, enabled, disabled, pending_permission] }
        payment_unavailable_message: { type: string }
        open_in_wechat_url: { type: string, format: uri }
        notification_channels:
          type: array
          items: { type: string, enum: [in_app, wechat_mini_subscription, wechat_oa, sms] }
        feature_flags:
          type: object
          required: [checkout_v2, community_video, external_notifications]
          properties:
            checkout_v2: { type: boolean }
            community_video: { type: boolean }
            external_notifications: { type: boolean }
    BottomNavigation:
      type: object
      required: [items, style, version]
      properties:
        items:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/BottomNavigationItem' }
        style: { $ref: '#/components/schemas/BottomNavigationStyle' }
        version: { type: [integer, 'null'], minimum: 1 }
    BottomNavigationItem:
      type: object
      required: [id, label, target, enabled, icon_url, active_icon_url]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_-]{1,31}$' }
        label: { type: string, minLength: 1, maxLength: 8 }
        target: { type: string, enum: [home, tasks, products, community, account] }
        enabled: { type: boolean }
        icon_url: { type: string, maxLength: 2048 }
        active_icon_url: { type: string, maxLength: 2048 }
    BottomNavigationStyle:
      type: object
      required: [background_color, text_color, active_color, border_color]
      properties:
        background_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        text_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        active_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        border_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: 秒 }
        user: { $ref: '#/components/schemas/User' }
    AdminAuthTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, admin, navigation]
      properties:
        access_token: { type: string }
        refresh_token: { type: string, writeOnly: true }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: 秒 }
        admin: { $ref: '#/components/schemas/AdminProfile' }
        navigation:
          type: array
          items: { $ref: '#/components/schemas/AdminNavigationItem' }
    AdminMfaChallenge:
      type: object
      required: [mfa_required, challenge_id, challenge_token, expires_at]
      properties:
        mfa_required: { type: boolean, const: true }
        challenge_id: { $ref: '#/components/schemas/PublicId' }
        challenge_token: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
    AdminProfile:
      type: object
      required: [id, account, display_name, status, requires_mfa, roles, permissions]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        account: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'], format: email }
        status: { type: string, enum: [active, disabled] }
        requires_mfa: { type: boolean }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    AdminNavigationItem:
      type: object
      required: [code, label, icon, path, permissions]
      properties:
        code: { type: string }
        label: { type: string }
        icon: { type: string }
        path: { type: string }
        permissions:
          type: array
          items: { type: string }
    IdentityConflict:
      type: object
      required: [id, kind, provider, status, candidate_count, created_at]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        kind: { type: string, enum: [union_collision, phone_already_bound] }
        provider: { type: string, enum: [wechat_mini, wechat_oa, phone] }
        status: { type: string, enum: [pending, resolved, rejected] }
        source_user_id: { type: [string, 'null'] }
        target_user_id: { type: [string, 'null'] }
        candidate_count: { type: integer, minimum: 0 }
        resolution: { type: [string, 'null'], enum: [attach_to_target, reject, null] }
        resolution_reason: { type: [string, 'null'] }
        resolved_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
    User:
      type: object
      required: [id, nickname, status, profile_completed, phone_bound]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        nickname: { type: string }
        avatar_file_id: { anyOf: [{ $ref: '#/components/schemas/PublicId' }, { type: 'null' }] }
        avatar_url: { type: [string, 'null'], format: uri }
        phone_masked: { type: [string, 'null'] }
        phone_bound: { type: boolean }
        status: { type: string, enum: [active, disabled, cancelled] }
        profile_completed: { type: boolean }
    UserAssetOverview:
      type: object
      required: [points, wallet, coupons, profile, version]
      properties:
        points:
          type: object
          required: [available, frozen, debt]
          properties:
            available: { type: integer, format: int64, minimum: 0 }
            frozen: { type: integer, format: int64, minimum: 0 }
            debt: { type: integer, format: int64, minimum: 0 }
        wallet:
          type: object
          required: [available_amount, frozen_amount, currency]
          properties:
            available_amount: { type: integer, format: int64, minimum: 0, description: 人民币分 }
            frozen_amount: { type: integer, format: int64, minimum: 0, description: 人民币分 }
            currency: { type: string, const: CNY }
        coupons:
          type: object
          required: [available]
          properties:
            available: { type: integer, minimum: 0 }
        profile:
          type: object
          required: [completed, reward_status]
          properties:
            completed: { type: boolean }
            reward_status: { type: string, enum: [not_eligible, pending, delivered, failed] }
        version: { type: integer, format: int64, minimum: 1 }
    LegalDocument:
      type: object
      required: [id, document_type, version, title, content_format, content, effective_at, current]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        document_type: { type: string, enum: [user_agreement, privacy_policy, task_rules, points_rules, wallet_rules, mall_after_sale, community_rules, cancellation_rules] }
        version: { type: string, maxLength: 40 }
        title: { type: string, maxLength: 160 }
        content_format: { type: string, enum: [markdown, html] }
        content: { type: string }
        content_hash: { type: string, maxLength: 128 }
        effective_at: { type: string, format: date-time }
        current: { type: boolean }
        consent_required: { type: boolean }
        withdrawal_allowed: { type: boolean }
        change_summary: { type: [string, 'null'] }
    UserConsent:
      type: object
      required: [id, legal_document_version_id, document_type, version, action, created_at]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        legal_document_version_id: { $ref: '#/components/schemas/PublicId' }
        document_type: { type: string }
        version: { type: string }
        action: { type: string, enum: [accept, withdraw] }
        client_platform: { type: string, enum: [wechat-mini, h5-wechat, h5-browser] }
        created_at: { type: string, format: date-time }
    PrivacyRequestInput:
      type: object
      required: [request_type, scope]
      properties:
        request_type: { type: string, enum: [access, copy, correction, deletion, withdraw_consent] }
        scope:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [profile, identities, devices, tasks, community, orders, assets, consents, all_available] }
        description: { type: string, maxLength: 1000 }
        recent_verification_code: { type: string, minLength: 4, maxLength: 16 }
    PrivacyRequest:
      allOf:
        - $ref: '#/components/schemas/PrivacyRequestInput'
        - type: object
          required: [id, status, blockers, requested_at]
          properties:
            id: { $ref: '#/components/schemas/PublicId' }
            status: { type: string, enum: [submitted, verifying, processing, completed, partially_completed, rejected, expired] }
            blockers:
              type: array
              items: { type: string, enum: [ongoing_business, active_dispute, statutory_retention, legal_hold, identity_verification_required] }
            result_file_id: { anyOf: [{ $ref: '#/components/schemas/PublicId' }, { type: 'null' }] }
            result_download_url: { type: [string, 'null'], description: 仅数据副本完成后短期返回。 }
            result_expires_at: { type: [string, 'null'], format: date-time }
            requested_at: { type: string, format: date-time }
            completed_at: { type: [string, 'null'], format: date-time }
            resolution_note: { type: [string, 'null'], maxLength: 1000 }
    AdminPrivacyRequest:
      allOf:
        - $ref: '#/components/schemas/PrivacyRequest'
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, nickname, status]
              properties:
                id: { $ref: '#/components/schemas/PublicId' }
                nickname: { type: string }
                status: { type: string }
    UserDevice:
      type: object
      required: [id, client_platform, last_active_at, current, revoked]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        client_platform: { type: string, enum: [wechat_mini, wechat_h5, web_h5] }
        device_name: { type: string }
        last_active_at: { type: string, format: date-time }
        current: { type: boolean }
        revoked: { type: boolean }
    AccountCancellationEligibility:
      type: object
      required: [eligible, blockers, wallet_balance_amount, frozen_assets, remaining_points, remaining_coupons]
      properties:
        eligible: { type: boolean }
        blockers:
          type: array
          items:
            type: string
            enum: [ongoing_order, ongoing_after_sale, ongoing_refund, ongoing_withdrawal, active_dispute, frozen_assets, wallet_balance_not_zero]
        wallet_balance_amount: { type: integer, minimum: 0, description: 人民币分 }
        frozen_assets: { type: boolean }
        remaining_points: { type: integer, minimum: 0 }
        remaining_coupons: { type: integer, minimum: 0 }
    AccountCancellationRequest:
      type: object
      required: [id, status, requested_at, cooling_off_ends_at]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        status: { type: string, enum: [cooling_off, cancelled, executed, rejected] }
        requested_at: { type: string, format: date-time }
        cooling_off_ends_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }
        cancel_reason: { type: [string, 'null'], maxLength: 64 }
        executed_at: { type: string, format: date-time }
        eligibility_snapshot: { $ref: '#/components/schemas/AccountCancellationEligibility' }
    AddressInput:
      type: object
      required: [recipient_name, phone, province, city, district, detail]
      properties:
        recipient_name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, minLength: 6, maxLength: 32 }
        province: { type: string, maxLength: 80 }
        city: { type: string, maxLength: 80 }
        district: { type: string, maxLength: 80 }
        detail: { type: string, minLength: 1, maxLength: 255 }
        postal_code: { type: [string, 'null'], maxLength: 20 }
        is_default: { type: boolean, default: false }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id, is_default]
          properties:
            id: { $ref: '#/components/schemas/PublicId' }
    UploadTicket:
      type: object
      required: [file_id, upload_url, method, headers, expires_at, status]
      properties:
        file_id: { $ref: '#/components/schemas/PublicId' }
        upload_url: { type: string, format: uri }
        method: { type: string, enum: [PUT, POST] }
        headers: { type: object, additionalProperties: { type: string } }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [issued, uploaded, scanning, clean, rejected, expired] }
    PrivateFile:
      type: object
      required: [file_id, purpose, filename, declared_mime, size, status]
      properties:
        file_id: { $ref: '#/components/schemas/PublicId' }
        purpose: { type: string, enum: [avatar, task_submission, task_report, community, refund_evidence, return_shipping] }
        filename: { type: string }
        declared_mime: { type: string }
        detected_mime: { type: [string, 'null'] }
        size: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [issued, uploaded, scanning, clean, rejected, expired] }
        rejection_code: { type: [string, 'null'] }
        sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        scanned_at: { type: [string, 'null'], format: date-time }
    TaskPublisherLogin:
      type: object
      required: [admin_account, password]
      properties:
        admin_account: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 200, format: password }
        second_factor_code: { type: string, minLength: 4, maxLength: 16 }
    TaskPublisherSummary:
      type: object
      required: [id, publisher_type, display_name, verification_status]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        publisher_type: { type: string, enum: [platform_admin, user, organization], description: user/organization 为未来兼容值，首发数据不得返回。 }
        display_name: { type: string, description: 面向用户展示的平台发布主体名称，不暴露管理员个人账号。 }
        verification_status: { type: string, enum: [unverified, pending, verified, expired, rejected] }
        publisher_badge: { type: string, maxLength: 40 }
    TaskPublisherProfile:
      type: object
      required: [id, publisher_type, admin_display_name, role, can_publish, permissions]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        publisher_type: { type: string, enum: [platform_admin] }
        admin_display_name: { type: string }
        role: { type: string, enum: [platform_admin, super_admin] }
        can_publish: { type: boolean }
        permissions:
          type: array
          items: { type: string, enum: [task.frontend_publish, task.frontend_pause, task.frontend_close] }
        publish_restriction_reason: { type: string, maxLength: 500 }
        restricted_until: { type: string, format: date-time }
        last_verified_at: { type: string, format: date-time }
    TaskPublisherSession:
      type: object
      required: [access_token, token_type, expires_at, profile]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
        profile: { $ref: '#/components/schemas/TaskPublisherProfile' }
    TaskPublishRequest:
      type: object
      required: [id, task_id, request_type, source_channel, status, task_status, submitted_at]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        task_id: { $ref: '#/components/schemas/PublicId' }
        request_type: { type: string, enum: [publish, major_update] }
        source_channel: { type: string, enum: [admin_web, user_frontend] }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        task_status: { type: string, enum: [draft, pending_approval, scheduled, published] }
        approval_type: { type: string, enum: [none, task_content, finance, risk, multiple] }
        review_reason: { type: string }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
    TaskVersionSummary:
      type: object
      required: [version_no, change_type, status, created_at]
      properties:
        version_no: { type: integer, minimum: 1 }
        change_type: { type: string, enum: [initial, minor, major, rollback] }
        source_version_no: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, pending_approval, published, superseded, rejected] }
        changed_fields:
          type: array
          items: { type: string }
        approval_type: { type: string, enum: [none, task_content, finance, risk, multiple] }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
    RewardBudgetPoolSummary:
      type: object
      required: [id, name, asset_type, total_amount, locked_amount, issued_amount, available_amount, status, version]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        name: { type: string }
        asset_type: { type: string, enum: [points, coupon, wallet_cash] }
        coupon_template_id: { $ref: '#/components/schemas/PublicId' }
        total_amount: { type: integer, format: int64, minimum: 0 }
        locked_amount: { type: integer, format: int64, minimum: 0 }
        issued_amount: { type: integer, format: int64, minimum: 0 }
        available_amount: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [active, frozen, closed] }
        version: { type: integer, minimum: 1 }
    TaskRewardBudgetInput:
      type: object
