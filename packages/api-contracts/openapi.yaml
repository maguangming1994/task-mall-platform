        value: {}
        source: { type: string, enum: [publish, rollback] }
        source_version: { type: [integer, 'null'] }
        reason: { type: string }
        published_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, category, scene_code, title, body, data, essential, created_at]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        category: { type: string, enum: [task, asset, order, after_sale, community, system] }
        scene_code: { type: string }
        title: { type: string }
        body: { type: string }
        data: { type: object, additionalProperties: true }
        essential: { type: boolean }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    NotificationPreferences:
      type: object
      required: [in_app_enabled, wechat_enabled, sms_enabled, marketing_subscribed, quiet_hours_start, quiet_hours_end]
      properties:
        in_app_enabled: { type: boolean }
        wechat_enabled: { type: boolean }
        sms_enabled: { type: boolean }
        marketing_subscribed: { type: boolean }
        quiet_hours_start: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        quiet_hours_end: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
    NotificationTemplate:
      type: object
      required: [id, scene_code, channel, status, current_version_no]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        scene_code: { type: string }
        channel: { type: string, enum: [in_app, wechat, sms] }
        status: { type: string, enum: [draft, published] }
        current_version_no: { type: integer, minimum: 0 }
    OperationsDashboard:
      type: object
      required: [users, tasks, orders, after_sales, community, finance, notifications, generated_at]
      properties:
        users: { type: object, additionalProperties: { type: integer } }
        tasks: { type: object, additionalProperties: { type: integer } }
        orders: { type: object, additionalProperties: { type: integer } }
        after_sales: { type: object, additionalProperties: { type: integer } }
        community: { type: object, additionalProperties: { type: integer } }
        finance: { type: object, additionalProperties: { type: integer } }
        notifications: { type: object, additionalProperties: { type: integer } }
        generated_at: { type: string, format: date-time }
    RuntimeReadiness:
      type: object
      required: [status, checks, checked_at]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ready, latency_ms]
            properties:
              ready: { type: boolean }
              latency_ms: { type: number, minimum: 0 }
        checked_at: { type: string, format: date-time }
    UatRun:
      type: object
      required: [id, release_version, environment, status, summary, report_hash, completed_at, cases]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        release_version: { type: string, maxLength: 80 }
        environment: { type: string }
        status: { type: string, enum: [passed, passed_local, failed] }
        summary:
          type: object
          required: [passed, failed, blocked, total]
          properties:
            passed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        report_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        completed_at: { type: string, format: date-time }
        cases:
          type: array
          items:
            type: object
            required: [case_code, scope, status, evidence]
            properties:
              case_code: { type: string }
              scope: { type: string, enum: [local, external] }
              status: { type: string, enum: [passed, failed, blocked] }
              evidence: { type: object, additionalProperties: true }
