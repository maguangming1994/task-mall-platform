openapi: 3.1.0
info:
  title: Task Mall API
  version: 0.31.0
  description: 微信小程序、通用 H5 与管理后台共享的任务商城 API 初始契约。
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local
tags:
  - name: System
  - name: Auth
  - name: User
  - name: Tasks
  - name: TaskPublisher
  - name: Points
  - name: Growth
  - name: Community
  - name: Products
  - name: Coupons
  - name: Checkout
  - name: Orders
  - name: Payments
  - name: Refunds
  - name: Notifications
  - name: Admin
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, const: ok }
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process liveness probe without dependency access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Database, cache, storage and migration readiness
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RuntimeReadiness' }
        '503':
          description: At least one required dependency is unavailable
  /internal/metrics:
    get:
      tags: [System]
      operationId: getPrometheusMetrics
      security: []
      parameters:
        - name: X-Monitoring-Token
          in: header
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        '200':
          description: Minimal Prometheus metrics without user identifiers or secrets
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: Metrics endpoint is hidden when the token is absent or invalid
  /client-capabilities:
    get:
      tags: [System]
      operationId: getClientCapabilities
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      responses:
        '200':
          description: Published login, share, payment and notification capabilities for the current client
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClientCapabilities' }
  /app-navigation:
    get:
      tags: [System]
      operationId: getAppNavigation
      security: []
      responses:
        '200':
          description: Published user-app bottom navigation configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BottomNavigation' }
  /legal-documents:
    get:
      tags: [System]
      operationId: listLegalDocuments
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - name: document_type
          in: query
          schema: { type: string, enum: [user_agreement, privacy_policy, task_rules, points_rules, wallet_rules, mall_after_sale, community_rules, cancellation_rules] }
        - name: include_history
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Current or requested historical legal and platform-rule documents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LegalDocument' }
  /auth/wechat-mini/login:
    post:
      tags: [Auth]
      operationId: loginWithWechatMini
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1 }
                referral_code: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: WeChat provider credentials or service unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/wechat-h5/login:
    post:
      tags: [Auth]
      operationId: loginWithWechatH5
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1 }
                referral_code: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: WeChat provider credentials or service unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/phone/login:
    post:
      tags: [Auth]
      operationId: loginWithPhone
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, verification_code]
              properties:
                phone: { type: string, minLength: 6, maxLength: 32 }
                verification_code: { type: string, minLength: 4, maxLength: 10 }
                referral_code: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/phone/verification-codes:
    post:
      tags: [Auth]
      operationId: requestPhoneVerificationCode
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { type: string, minLength: 6, maxLength: 32 }
                purpose: { type: string, enum: [login, bind_phone, change_phone_old, change_phone_new] }
      responses:
        '202':
          description: Verification code accepted for delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '429':
          description: Rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                all_devices: { type: boolean, default: false }
      responses:
        '204':
          description: Current session or all requested sessions revoked
  /admin/auth/login:
    post:
      tags: [Admin]
      operationId: loginAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, minLength: 3, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 200, writeOnly: true }
      responses:
        '200':
          $ref: '#/components/responses/AdminAuthSuccess'
        '202':
          description: Password accepted; MFA challenge must be completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminMfaChallenge' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account disabled or requires a second verification factor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Account and IP pair temporarily locked after repeated failures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /admin/auth/refresh:
    post:
      tags: [Admin]
      operationId: refreshAdminToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, writeOnly: true }
      responses:
        '200':
          $ref: '#/components/responses/AdminAuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/auth/logout:
    post:
      tags: [Admin]
      operationId: logoutAdmin
      security:
        - adminBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                all_sessions: { type: boolean, default: false }
      responses:
        '204':
          description: Current admin session or all requested admin sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/auth/mfa/verify:
    post:
      tags: [Admin]
      operationId: verifyAdminMfaLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, challenge_token, code]
              properties:
                challenge_id: { $ref: '#/components/schemas/PublicId' }
                challenge_token: { type: string, writeOnly: true }
                code: { type: string, minLength: 6, maxLength: 20, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/AdminAuthSuccess' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/auth/verify:
    post:
      tags: [Admin]
      operationId: refreshAdminRecentVerification
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, writeOnly: true }
                mfa_code: { type: string, writeOnly: true }
      responses:
        '200': { description: Recent-verification window refreshed }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/mfa/totp/enroll:
    post:
      tags: [Admin]
      operationId: enrollAdminTotp
      security: [{ adminBearerAuth: [] }]
      responses:
        '201': { description: Pending TOTP secret and otpauth URI returned once }
  /admin/mfa/totp/confirm:
    post:
      tags: [Admin]
      operationId: confirmAdminTotp
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { description: MFA enabled and one-time recovery codes returned }
  /admin/admin-users:
    get:
      tags: [Admin]
      operationId: listManagedAdmins
      security: [{ adminBearerAuth: [] }]
      responses:
        '200': { description: Managed administrator list }
    post:
      tags: [Admin]
      operationId: createManagedAdmin
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, display_name, password, role_codes]
              properties:
                account: { type: string, minLength: 3, maxLength: 100 }
                display_name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, writeOnly: true }
                role_codes: { type: array, minItems: 1, items: { type: string } }
      responses:
        '201': { description: Administrator created without a default password }
  /admin/roles:
    get:
      tags: [Admin]
      operationId: listAdminRoles
      security: [{ adminBearerAuth: [] }]
      responses:
        '200': { description: Roles and effective permissions }
  /admin/admin-users/{admin_user_id}/roles:
    put:
      tags: [Admin]
      operationId: updateManagedAdminRoles
      security: [{ adminBearerAuth: [] }]
      parameters: [{ name: admin_user_id, in: path, required: true, schema: { $ref: '#/components/schemas/PublicId' } }]
      responses:
        '200': { description: Roles replaced and effective immediately }
  /admin/admin-users/{admin_user_id}/status:
    put:
      tags: [Admin]
      operationId: updateManagedAdminStatus
      security: [{ adminBearerAuth: [] }]
      parameters: [{ name: admin_user_id, in: path, required: true, schema: { $ref: '#/components/schemas/PublicId' } }]
      responses:
        '200': { description: Account status updated; disabling revokes sessions }
  /admin/admin-users/{admin_user_id}/revoke-sessions:
    post:
      tags: [Admin]
      operationId: revokeManagedAdminSessions
      security: [{ adminBearerAuth: [] }]
      parameters: [{ name: admin_user_id, in: path, required: true, schema: { $ref: '#/components/schemas/PublicId' } }]
      responses:
        '200': { description: All active sessions revoked }
  /admin/admin-users/{admin_user_id}/reset-mfa:
    post:
      tags: [Admin]
      operationId: resetManagedAdminMfa
      security: [{ adminBearerAuth: [] }]
      parameters: [{ name: admin_user_id, in: path, required: true, schema: { $ref: '#/components/schemas/PublicId' } }]
      responses:
        '200': { description: MFA reset and all active sessions revoked }
  /admin/me:
    get:
      tags: [Admin]
      operationId: getCurrentAdmin
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Current administrator and effective RBAC grants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/navigation:
    get:
      tags: [Admin]
      operationId: getAdminNavigation
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Navigation modules visible under the administrator's effective permissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminNavigationItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/identity-conflicts:
    get:
      tags: [Admin]
      operationId: listIdentityConflicts
      security:
        - adminBearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, resolved, rejected], default: pending }
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Identity conflicts visible to authorized identity administrators
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/IdentityConflict' }
        '403':
          description: Missing identity.resolve permission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /admin/identity-conflicts/{conflict_id}/resolve:
    post:
      tags: [Admin]
      operationId: resolveIdentityConflict
      security:
        - adminBearerAuth: []
      parameters:
        - name: conflict_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PublicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, reason]
              properties:
                resolution: { type: string, enum: [attach_to_target, reject] }
                reason: { type: string, minLength: 4, maxLength: 500 }
                target_user_id:
                  allOf:
                    - $ref: '#/components/schemas/PublicId'
                  description: UnionID 对应多个候选账号时必填，且必须属于候选范围。
      responses:
        '200':
          description: Conflict resolved and affected sessions revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IdentityConflict' }
        '403':
          description: Missing identity.resolve permission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /admin/legal-documents:
    get:
      tags: [Admin]
      operationId: listAdminLegalDocuments
      security:
        - adminBearerAuth: []
      parameters:
        - name: document_type
          in: query
          schema: { type: string, enum: [user_agreement, privacy_policy, task_rules, points_rules, wallet_rules, mall_after_sale, community_rules, cancellation_rules] }
        - name: status
          in: query
          schema: { type: string, enum: [draft, published] }
      responses:
        '200':
          description: Draft and published legal-document versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    post:
      tags: [Admin]
      operationId: createLegalDocumentDraft
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type, version, title, content, consent_required, withdrawal_allowed, effective_at, change_summary]
              properties:
                document_type: { type: string, enum: [user_agreement, privacy_policy, task_rules, points_rules, wallet_rules, mall_after_sale, community_rules, cancellation_rules] }
                version: { type: string, maxLength: 40 }
                title: { type: string, maxLength: 160 }
                content_format: { type: string, const: markdown }
                content: { type: string, minLength: 20 }
                consent_required: { type: boolean }
                withdrawal_allowed: { type: boolean }
                effective_at: { type: string, format: date-time }
                change_summary: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Immutable-after-publication draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
  /admin/legal-documents/{legal_document_id}/publish:
    post:
      tags: [Admin]
      operationId: publishLegalDocument
      security:
        - adminBearerAuth: []
      parameters:
        - name: legal_document_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PublicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_legal_review, reason]
              properties:
                confirm_legal_review: { type: boolean, const: true }
                reason: { type: string, minLength: 4, maxLength: 500 }
      responses:
        '200':
          description: Version published now or scheduled by effective_at
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '409':
          $ref: '#/components/responses/Conflict'
  /me:
    get:
      tags: [User]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nickname: { type: string, minLength: 1, maxLength: 80 }
                avatar_file_id: { $ref: '#/components/schemas/PublicId' }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/asset-overview:
    get:
      tags: [User]
      operationId: getMyAssetOverview
      responses:
        '200':
          description: Points, wallet, coupon and profile-milestone summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserAssetOverview' }
  /me/legal-consents:
    get:
      tags: [User]
      operationId: listMyLegalConsents
      responses:
        '200':
          description: Current user's accepted and withdrawn document versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/UserConsent' }
    post:
      tags: [User]
      operationId: recordMyLegalConsent
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_document_version_id, action]
              properties:
                legal_document_version_id: { $ref: '#/components/schemas/PublicId' }
                action: { type: string, enum: [accept, withdraw] }
                acknowledge_service_restriction:
                  type: boolean
                  default: false
                  description: 撤回必要协议时必须为 true，撤回后相关业务门槛重新生效。
      responses:
        '201':
          description: Append-only consent action recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserConsent' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/legal-consents/pending:
    get:
      tags: [User]
      operationId: listPendingLegalConsents
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [account, task, community, checkout, wallet, account_cancellation] }
      responses:
        '200':
          description: Current required document versions not presently accepted by this user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LegalDocument' }
  /me/privacy-requests:
    get:
      tags: [User]
      operationId: listMyPrivacyRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Current user's privacy-right requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PrivacyRequest' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [User]
      operationId: createMyPrivacyRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyRequestInput' }
      responses:
        '201':
          description: Privacy request created; blockers are evaluated without replacing account cancellation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
