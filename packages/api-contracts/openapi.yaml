    post:
      tags: [Payments]
      operationId: receiveWechatPaymentNotification
      security: []
      parameters:
        - { name: Wechatpay-Serial, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Signature, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Nonce, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, event_type, resource]
              properties:
                id: { type: string }
                event_type: { type: string }
                resource:
                  type: object
                  description: WeChat Pay AES-256-GCM encrypted resource envelope; plaintext is never trusted before signature verification.
                  additionalProperties: true
      responses:
        '200':
          description: Notification verified and accepted idempotently
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, const: SUCCESS }
                  message: { type: string }
        '401':
          description: Signature verification failed
