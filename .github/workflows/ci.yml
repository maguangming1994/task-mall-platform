name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --dir apps/user-app test:unit
      - run: pnpm run lint
      - run: pnpm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore checksum-pinned school emblems
        working-directory: .
        run: node scripts/restore-campus-emblems.mjs
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: curl, fileinfo, intl, mbstring, openssl, pdo_pgsql, pdo_sqlite, sodium, sqlite3, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
      - run: php vendor/bin/pint --test

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore checksum-pinned school emblems
        working-directory: .
        run: node scripts/restore-campus-emblems.mjs
      - name: Validate Bash syntax
        run: |
          bash -n scripts/deploy-production.sh
          bash -n scripts/create-release-bundle.sh
          bash -n scripts/pull-production-images.sh
          bash -n scripts/server/task-mall-receive.sh
          bash -n scripts/server/configure-ghcr.sh
          bash -n scripts/server/configure-tcr.sh
          bash tests/deployment/pull-production-images.test.sh
          bash tests/deployment/deploy-production.test.sh
          bash tests/deployment/create-release-bundle.test.sh
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/release.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: Validate production Compose
        run: |
          install -d "$RUNNER_TEMP/task-mall-ci-secrets"
          touch "$RUNNER_TEMP/task-mall-ci-secrets/merchant.pem"
          touch "$RUNNER_TEMP/task-mall-ci-secrets/platform.pem"
          cat > "$RUNNER_TEMP/task-mall-ci.env" <<EOF
          DB_DATABASE=task_mall_ci
          DB_USERNAME=task_mall_ci
          DB_PASSWORD=ci-only-placeholder
          REDIS_PASSWORD=ci-only-placeholder
          WECHAT_PAYMENT_PRIVATE_KEY_FILE=$RUNNER_TEMP/task-mall-ci-secrets/merchant.pem
          WECHAT_PAYMENT_PLATFORM_CERT_FILE=$RUNNER_TEMP/task-mall-ci-secrets/platform.pem
          EOF
          PRODUCTION_ENV_FILE="$RUNNER_TEMP/task-mall-ci.env" \
          RELEASE_VERSION=0000000000000000000000000000000000000000 \
            docker compose \
              --env-file "$RUNNER_TEMP/task-mall-ci.env" \
              -f infra/compose.production.yaml \
              config --quiet
      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host reverb:127.0.0.1 \
            --volume "$PWD/infra/nginx/task-mall.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Build production API image
        run: |
          docker build --pull \
            --build-arg ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine \
            --file infra/docker/api.Dockerfile \
            --tag task-mall-api:ci \
            .

  production-images:
    name: Build and publish production images
    needs: [frontend, api, deployment-config]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    # 自建 runner 位于国内生产服务器：构建与 TCR 推送全程国内网络，层缓存常驻本机，
    # 根治 GitHub 境外 runner 跨境推送 44+ 分钟且易被腰斩的问题。
    runs-on: [self-hosted, linux, x64]
    environment: production
    permissions:
      contents: read
    # 国内推送 TCR 正常为分钟级；180 分钟仅作极端兜底。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore checksum-pinned school emblems
        run: node scripts/restore-campus-emblems.mjs
      - name: Log in to private Tencent registry
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TCR_USERNAME" ] || [ -z "$TCR_PASSWORD" ]; then
            echo 'Set TCR_USERNAME and TCR_PASSWORD in production environment secrets before publishing.' >&2
            exit 1
          fi
          printf '%s' "$TCR_PASSWORD" | docker login ccr.ccs.tencentyun.com --username "$TCR_USERNAME" --password-stdin
      - name: Set up cached image builder
        # self-hosted runner 常驻：builder 已存在则直接复用（层缓存跨构建保留），不存在才创建。
        run: |
          docker buildx inspect task-mall-ci >/dev/null 2>&1 \
            || docker buildx create --driver docker-container --name task-mall-ci
          docker buildx use task-mall-ci
      - name: Build and push API image
        env:
          IMAGE_PREFIX: ccr.ccs.tencentyun.com/task-mall-platform/task-mall
        run: |
          image="${IMAGE_PREFIX,,}-api"
          export image
          if docker manifest inspect "$image:$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Reusing published commit image: $image:$GITHUB_SHA"
            exit 0
          fi
          push_image() {
            docker buildx build --progress plain --platform linux/amd64 \
              --provenance=false --sbom=false \
              --build-arg ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --cache-from "type=registry,ref=$image:buildcache" \
              --cache-to type=inline \
              --file infra/docker/api.Dockerfile \
              --tag "$image:$GITHUB_SHA" --push .
            # 跨境推送单标签约 44 分钟；buildcache 用镜像仓库侧复制避免重复上传同一批层。
            docker buildx imagetools create -t "$image:buildcache" "$image:$GITHUB_SHA"
          }
          export -f push_image
          for attempt in 1 2; do
            if timeout 5400 bash -c push_image; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "API image publish failed after 2 attempts." >&2
              exit 1
            fi
            echo "API image publish stalled or failed (attempt $attempt); retrying after 20s." >&2
            sleep 20
          done
      - name: Build and push Web image
        env:
          IMAGE_PREFIX: ccr.ccs.tencentyun.com/task-mall-platform/task-mall
          VITE_H5_PUBLIC_URL: ${{ vars.VITE_H5_PUBLIC_URL || 'https://rwsc.jxgxnxs.cn' }}
          VITE_WECHAT_OA_APP_ID: ${{ vars.VITE_WECHAT_OA_APP_ID }}
        run: |
          image="${IMAGE_PREFIX,,}-web"
          export image
          if docker manifest inspect "$image:$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Reusing published commit image: $image:$GITHUB_SHA"
            exit 0
          fi
          push_image() {
            docker buildx build --progress plain --platform linux/amd64 \
              --provenance=false --sbom=false \
              --build-arg VITE_API_BASE_URL=/api/v1 \
              --build-arg "VITE_H5_PUBLIC_URL=$VITE_H5_PUBLIC_URL" \
              --build-arg "VITE_WECHAT_OA_APP_ID=$VITE_WECHAT_OA_APP_ID" \
              --build-arg "RELEASE_VERSION=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --cache-from "type=registry,ref=$image:buildcache" \
              --cache-to type=inline \
              --file infra/docker/web.Dockerfile \
              --tag "$image:$GITHUB_SHA" --push .
            # 同 API：buildcache 走镜像仓库侧复制，避免同一批层重复跨境上传。
            docker buildx imagetools create -t "$image:buildcache" "$image:$GITHUB_SHA"
          }
          export -f push_image
          for attempt in 1 2; do
            if timeout 5400 bash -c push_image; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Web image publish failed after 2 attempts." >&2
              exit 1
            fi
            echo "Web image publish stalled or failed (attempt $attempt); retrying after 20s." >&2
            sleep 20
          done
      - name: Log out of Tencent registry
        if: always()
        run: docker logout ccr.ccs.tencentyun.com

  deploy-production:
    name: Deploy production
    needs: [production-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: task-mall-production
      cancel-in-progress: false
    # Images are already built; only transfer, backup, migrate and switch here.
    # Cross-border bundle transfer to the production host can run below 20 kB/s;
    # a 25 MiB incremental bundle therefore needs a generous transfer window.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create incremental release bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "https://rwsc.jxgxnxs.cn/release.json?bundle=$RELEASE_SHA-$GITHUB_RUN_ATTEMPT" \
            | jq -er '.release')
          export BASE_SHA
          bash scripts/create-release-bundle.sh "$RUNNER_TEMP/task-mall.bundle"

      - name: Configure deployment SSH
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/task-mall-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/task-mall-deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/task-mall-deploy" >/dev/null

      - name: Deploy tested commit
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Transferring $(wc -c < "$RUNNER_TEMP/task-mall.bundle") bytes to deployment SSH"
          dd if="$RUNNER_TEMP/task-mall.bundle" bs=64K status=progress | ssh \
            -T -C \
            -i "$HOME/.ssh/task-mall-deploy" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $RELEASE_SHA"

      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            https://rwsc.jxgxnxs.cn/api/v1/health/ready >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            https://rwsc.jxgxnxs.cn/ >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            https://rwsc.jxgxnxs.cn/admin/ >/dev/null
      - name: Verify deployed commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://rwsc.jxgxnxs.cn/release.json?commit=$RELEASE_SHA" \
            | jq -e --arg sha "$RELEASE_SHA" '.release == $sha'
